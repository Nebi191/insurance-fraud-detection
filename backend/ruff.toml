# Ruff configuration — applies to backend/ only (ruff searches for config upwards
# from the file, so frontend/ is unaffected).
#
# WHY THIS FILE EXISTS:
# Without configuration, ruff treated the `app` package as third-party and wanted
# to sort `from app.model import ...` alphabetically among the `fastapi` imports.
# That was not a style preference but ruff not knowing the project layout: `src`
# tells it the truth by pointing at the package root. No rule is silenced — the
# rule set is ruff's default (E4/E7/E9/F).
#
# `src` is relative to the directory containing this file: `app/` lives under
# backend/, so `app` is recognised as first-party.
src = ["."]

[lint.isort]
known-first-party = ["app"]
