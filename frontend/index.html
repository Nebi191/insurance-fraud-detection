<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Declaring an icon stops the browser from probing /favicon.ico and logging a
      404 on every page load. SVG keeps it crisp at any size and needs no binary
      asset in the repo.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Insurance Claim Fraud Scoring</title>
    <meta
      name="description"
      content="LightGBM insurance claim fraud scoring with per-prediction SHAP explanations and out-of-distribution input warnings."
    />
    <script>
      // The theme is applied BEFORE React loads. Otherwise a user on the dark
      // theme sees a white flash on first paint (FOUC).
      (() => {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (saved === null && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
