<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Shield = risk screening, magnifier = investigation. Drawn with thick strokes
    so the mark stays readable when the browser scales it down to 16 px.

    Inline SVG on purpose: a favicon that pulls in an external file or font would
    be blocked by the strict CSP the app is deployed under.
  -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <path d="M16 5.5 25 9v7.2c0 5.4-3.6 9.4-9 11.3-5.4-1.9-9-5.9-9-11.3V9z"
        fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="14.8" cy="14.6" r="3.6" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
  <path d="m17.6 17.4 3.5 3.5" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
</svg>
